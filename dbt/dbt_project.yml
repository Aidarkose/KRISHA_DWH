name: 'krisha_dwh'
version: '1.0.0'
config-version: 2

profile: 'krisha_dwh'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  load_datetime: "LOAD_DATETIME"
  record_source: "RECORD_SOURCE"

models:
  krisha_dwh:
    marts:
      +materialized: view
      +schema: dbt
    dv:
      +schema: dv
      stage:
        +materialized: view
      raw_vault:
        +materialized: incremental
        +on_schema_change: append_new_columns

  automate_dv:
    +schema: dv
